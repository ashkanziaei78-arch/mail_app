services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailing
      POSTGRES_PASSWORD: mailing
      POSTGRES_DB: mailing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailing"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://mailing:mailing@postgres:5432/mailing?schema=public
      APP_SECRET: ${APP_SECRET:?APP_SECRET را در .env تعریف کنید}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports: ["3000:3000"]

volumes:
  pgdata:
