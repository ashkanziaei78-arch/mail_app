  </style>

        <!-- 1 print -->
        <g transform="translate(1600 560)"><g id="f04-st1">

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const wipe = (el, t, d) => tl.fromTo(el, { clipPath: "inset(-30px 0 -40px 100%)" }, { clipPath: "inset(-30px 0 -40px 0%)", duration: d || 0.42, ease: "power3.out" }, t);
      const X = [1600, 1290, 980, 670, 360];
      const T = [0.2, 1.0, 1.8, 2.6, 3.6];          // one station per spoken word
      wipe("#f04-head", 0.0, 0.45);
      tl.fromTo("#f04-rail", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.0);
      tl.fromTo(["#f04-st1", "#f04-st2", "#f04-st3", "#f04-st4", "#f04-st5"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.06, ease: "power2.out" }, 0.05);
      tl.fromTo("#f04-sheet-in", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.2);
      // outbound: the sheet hops station to station, each station acts on its beat
      X.forEach((x, i) => {
        if (i > 0) tl.to("#f04-sheet", { attr: { transform: `translate(${x} 420)` }, duration: 0.42, ease: "power2.inOut" }, T[i] - 0.42);
        tl.to(`#f04-l${i + 1}`, { color: "#111c2e", duration: 0.15 }, T[i]);
        tl.fromTo(`#f04-st${i + 1}`, { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, transformOrigin: "50% 50%", immediateRender: false }, T[i]);
      });
      tl.fromTo("#f04-sig", { strokeDasharray: 200, strokeDashoffset: 200 }, { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 1.0);
      tl.fromTo("#f04-stamp", { y: -40 }, { keyframes: [{ y: 30, duration: 0.18, ease: "power3.in" }, { y: -40, duration: 0.3, ease: "power2.out" }] }, 1.7);
      tl.fromTo("#f04-ink", { opacity: 0, scale: 0.5, svgOrigin: "0 25" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 1.88);
      // camera nudges toward the travelling sheet
      tl.fromTo("#f04-world", { x: -60 }, { x: 60, duration: 4.0, ease: "sine.inOut" }, 0.2);
      // return trip: the same path, faster, all labels relight in reverse
      wipe("#f04-back", 4.3, 0.5);
      tl.to("#f04-world", { x: -40, duration: 2.6, ease: "sine.inOut" }, 4.4);
      [...X].reverse().forEach((x, j) => {
        const t = 4.6 + j * 0.42;
        tl.to("#f04-sheet", { attr: { transform: `translate(${x} 420)` }, duration: 0.36, ease: "power2.inOut" }, t);
        tl.to(`#f04-l${5 - j}`, { color: "#4e5d74", duration: 0.12 }, t + 0.3);
      });
      tl.to("#f04-head", { opacity: 0.25, duration: 0.4 }, 4.4);
      window.__timelines["04-paper"] = tl;
    })();
